# dsh-market 的 bundle 层：让 `dsh plugin add dsh-market` 装完就能用。没有它，dsh 的
# plugin 命令只打印
#   warning: dsh-market declares no dsh.bundle — installed as a plain dependency
# 然后把包装进去、**永远不激活**，用户得自己手写 patch 才能看到面板。
#
# **id 是 `dsdesktop-market` 而不是 `dsh-market`**：npm 上已有的 `dshmarket` 插件
# 自带的 patch 用的正是 `dsh-market` 这个 id。`- insert:` 不去重，两个都装上就是
# `duplicate loader entry id` —— cordis loader 直接抛、内核秒退、桌面端黑屏。
# 通用词做 id 的老问题，这次是撞在同类产品上。

- insert:
    - id: dsdesktop-market
      name: '@easytz/dsh-market'
